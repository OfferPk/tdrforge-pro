    <text x="25" y="95" font-family="sans-serif" font-size="10" fill="#94a3b8">SANA Registry Audit Schema</text>

    <rect x="15" y="120" width="210" height="50" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
    <text x="25" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Glass Cockpit Studio</text>
    <text x="25" y="160" font-family="sans-serif" font-size="10" fill="#94a3b8">Audit Progress Radar &amp; Tables</text>

    <rect x="15" y="185" width="210" height="50" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
    <text x="25" y="210" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Python 3 Assessment CLI</text>
    <text x="25" y="225" font-family="sans-serif" font-size="10" fill="#94a3b8">Automated Repo Auditing</text>

    <rect x="15" y="250" width="210" height="50" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
    <text x="25" y="275" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">10-Point Normative Auditor</text>
    <text x="25" y="290" font-family="sans-serif" font-size="10" fill="#94a3b8">100% Certified Verification</text>
