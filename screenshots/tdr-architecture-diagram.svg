    <text x="25" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Sec 4: Ingest &amp; Fixity Logs</text>
    <text x="25" y="160" font-family="sans-serif" font-size="10" fill="#94a3b8">SIP-to-AIP, SHA-256 Audits</text>

    <rect x="15" y="185" width="210" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="25" y="210" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Sec 5: Security Architecture</text>
    <text x="25" y="225" font-family="sans-serif" font-size="10" fill="#94a3b8">Multi-Region Disaster Recovery</text>

    <rect x="15" y="250" width="210" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
