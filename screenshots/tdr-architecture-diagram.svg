      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="900" height="500" rx="16" fill="url(#bg)" stroke="#1f2937" stroke-width="2" />

  <text x="40" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">TDRForge Pro Architecture</text>
  <text x="40" y="70" font-family="sans-serif" font-size="12" fill="#38bdf8">CCSDS 652.0-M-2 &amp; ISO 16363 Trustworthy Digital Repository (TDR) Certification Framework</text>

  <!-- Layer 1 -->
  <g transform="translate(40, 110)">
