    <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#94a3b8">1. AUDIT EVIDENCE INPUTS</text>
    
    <rect x="15" y="55" width="210" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
