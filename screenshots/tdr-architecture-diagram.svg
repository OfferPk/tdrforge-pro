    <text x="25" y="275" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Certification Verdict</text>
    <text x="25" y="290" font-family="sans-serif" font-size="10" fill="#94a3b8">Score &ge; 75% ISO 16363 Certified</text>
  </g>

  <path d="M 570 280 L 620 280" stroke="#34d399" stroke-width="2" />

